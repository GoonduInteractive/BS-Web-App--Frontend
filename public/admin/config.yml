# Decap CMS configuration. Read by /admin/index.html.
#
# The site is on Vercel, so Decap's default Netlify Identity login is not
# available. Editors log in with GitHub instead, and the token exchange runs on
# a small OAuth gateway deployed as its own Vercel project, see README.md →
# Content editing for the setup. This repo carries no server code for it.
#
# WHAT DECAP OWNS: News, the About page's team and partners, the Characters and
# the legal pages. Everything
# game-side (leaderboards, tournaments, community, merch, players) comes
# through the adapters in src/lib/api/ and, later, the game backend. Not here.

backend:
  # NOT git-gateway. That backend is Netlify Identity, which this site has no
  # access to; on Vercel it fails at login with "Your Git Gateway backend is
  # not returning valid settings".
  name: github
  repo: GoonduInteractive/BS-Web-App--Frontend
  # PRODUCTION. main is production and dev is staging, and this is the branch
  # Decap lists entries from and commits publishes to, so it has to be the one
  # Vercel serves the live site from or nothing an editor publishes appears.
  branch: main
  # The OAuth gateway (daresaydigital/decap-cms-oauth), its own Vercel project.
  # Decap sends editors to <base_url>/auth and takes the token back from
  # <base_url>/callback. NO TRAILING SLASH: Decap joins the path onto this, so
  # a slash here asks the gateway for //auth and the popup dies on a 404.
  base_url: https://decap-cms-oauth-gray.vercel.app
  
  commit_messages:
    create: 'content({{collection}}): create {{slug}}'
    update: 'content({{collection}}): update {{slug}}'
    delete: 'content({{collection}}): delete {{slug}}'
    uploadMedia: 'content(media): upload {{path}}'
    deleteMedia: 'content(media): delete {{path}}'

# Draft → In review → Ready. Publishing merges the pull request Decap opened
# against main, so nothing reaches the live site unreviewed.
publish_mode: editorial_workflow

# On localhost with `npm run cms` running, the admin offers to work against the
# local checkout instead of GitHub. No login, and files land in the working tree.
local_backend: true

# The default upload folder. News uses it; the other two collections point at
# the folders their pictures already live in.
media_folder: public/assets/news
public_folder: /assets/news

# Every entry is written in both locales. One entry, two tabs in the editor:
# src/content/<collection>/en/<slug>.md and src/content/<collection>/ig/<slug>.md.
# A field marked `i18n: true` is translated; `i18n: duplicate` is the same in
# both and greyed out on the Igbo tab.
#
# THE IGBO TAB DOES NOT HAVE TO BE WRITTEN BY HAND. Decap insists both tabs are
# filled before publishing, so the editor clicks "Fill in from another locale"
# on the Igbo tab, which copies the English across, and publishes. After the
# publish lands on main, scripts/translate/translate.mjs (run by the Translate
# Igbo workflow) sees Igbo that is identical to the English and machine-
# translates it. Igbo an editor writes or corrects by hand is never overwritten.
i18n:
  structure: multiple_folders
  locales: [en, ig]
  default_locale: en

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ---------------------------------------------------------------------------
  # NEWS, the News & Updates page. Mirrors `Article` in src/types/news.ts;
  # src/lib/api/news.ts reads these files at build (lib/schemas/news.ts checks them).
  # ---------------------------------------------------------------------------
  - name: news
    label: News
    label_singular: Article
    description: Articles for the News & Updates page. Write the English; on the Igbo tab click "Fill in from another locale", then publish. The Igbo is translated automatically afterwards, and any Igbo you write yourself is kept.
    folder: src/content/news
    create: true
    delete: true
    i18n: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} ({{published}})'
    sortable_fields: [published, title]
    view_filters:
      - label: News
        field: tags
        pattern: news
      - label: Announcements
        field: tags
        pattern: announcement
    fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Excerpt
        name: excerpt
        widget: text
        hint: Shown on the article card and used as the page description.
        i18n: true
      - label: Published
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
      - label: Tags
        name: tags
        widget: select
        multiple: true
        options:
          - { label: News, value: news }
          - { label: Announcement, value: announcement }
        default: [news]
        i18n: duplicate
      # The cover: the picture full bleed, or the torn banner. The banner is a
      # coloured band on the left with a volume tag, a title and an author
      # line, torn down its edge, with the picture beside it. Per article.
      - label: Cover style
        name: coverStyle
        widget: select
        options:
          - { label: "Full image: the picture on its own", value: full }
          - { label: "Torn banner: a coloured band with the volume tag, title and author, torn down its edge, with the picture beside it", value: torn }
        default: full
        hint: Choose Torn banner to get the tear. The three fields named "Torn banner" below do nothing while this says Full image.
        i18n: duplicate
      - label: Picture
        name: image
        widget: image
        hint: The card and the top of the article. On a torn banner it is the picture to the right of the tear.
        i18n: duplicate
      - label: Picture description
        name: imageAlt
        widget: string
        hint: What the picture shows, for screen readers and search.
        i18n: true
      - label: 'Torn banner: band colour'
        name: band
        widget: select
        options:
          - { label: Grey-blue (dusk), value: dusk }
          - { label: Dark red (clot), value: clot }
          - { label: Deep red (ember), value: ember }
          - { label: Darkest red (oxblood), value: oxblood }
          - { label: Red (blood), value: blood }
          - { label: Bright red (carmine), value: carmine }
          - { label: Crimson, value: crimson }
          - { label: Near-black (menu), value: menu }
          - { label: Black-blue (abyss), value: abyss }
          - { label: Dark grey (ash), value: ash }
        default: dusk
        hint: The colour of the torn band. The site's palette; the frame uses grey-blue and dark red.
        i18n: duplicate
      - label: 'Torn banner: volume tag'
        name: volume
        widget: string
        required: false
        hint: The small plate above the title, e.g. VOL. 1. Leave empty for no plate.
        i18n: true
      - label: 'Torn banner: cover title'
        name: coverTitle
        widget: text
        required: false
        hint: The big title on the band. Press Enter to break a line. Empty uses the article title. A long one is sized down to fit the band.
        i18n: true
      - label: Author
        name: author
        widget: string
        required: false
        hint: Who wrote it. Shown as the byline on the article, and on a torn banner at the foot of the band. Empty uses "By Goondu Staff".
        i18n: true
      - label: Body image
        name: bodyImage
        widget: image
        required: false
        hint: An optional second picture partway down the article.
        i18n: duplicate
      - label: Body
        name: body
        widget: markdown
        i18n: true

  # ---------------------------------------------------------------------------
  # CHARACTERS, the roster on The Characters page and each character's detail
  # page. src/lib/api/characters.ts reads these files at build
  # (lib/schemas/character.ts checks them). Per-file framing (how a render is
  # cropped into a card, a tile or a plate) is NOT here: it is solved for each
  # picture file and stays in code (lib/characters.ts), keyed by the file.
  # The paragraph fields are plain text, the pages draw paragraphs, not
  # markdown, so a blank line is a paragraph break and nothing else is styled.
  # ---------------------------------------------------------------------------
  - name: characters
    label: Characters
    label_singular: Character
    description: The roster and the character detail pages. Champions, Gods, Legends & Adversaries. Bio is the card's modal; the rest is the detail page. Pictures are the delivered renders; how each one is cropped is set in code, not here. Igbo tab as for News.
    folder: src/content/characters
    create: true
    delete: true
    i18n: true
    extension: md
    format: frontmatter
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} ({{group}})'
    sortable_fields: [order, name]
    media_folder: /public/assets/characters
    public_folder: /assets/characters
    view_filters:
      - label: Champions
        field: group
        pattern: champions
      - label: Gods
        field: group
        pattern: gods
      - label: Legends & Adversaries
        field: group
        pattern: legends
    fields:
      - label: Name
        name: name
        widget: string
        i18n: true
      - label: Alias
        name: role
        widget: string
        required: false
        hint: The line under the name, e.g. The Nightlit Fugitive.
        i18n: true
      - label: Group
        name: group
        widget: select
        options:
          - { label: Champions, value: champions }
          - { label: Gods, value: gods }
          - { label: Legends & Adversaries, value: legends }
        default: champions
        i18n: duplicate
      - label: Show on the site
        name: visible
        widget: boolean
        default: true
        hint: Off keeps the character out of the roster and the detail pages until their art and copy are ready.
        i18n: duplicate
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: Position within the group. Lower comes first.
        i18n: duplicate
      - label: Portrait
        name: image
        widget: image
        hint: The roster card, the modal and the detail hero. A cutout PNG with a transparent background.
        i18n: duplicate
      - label: Portrait description
        name: alt
        widget: string
        hint: What the portrait shows, for screen readers and search.
        i18n: true
      - label: Bio
        name: bio
        widget: text
        required: false
        hint: The short text on the roster card and its modal. Plain text; leave a blank line between paragraphs.
        i18n: true
      - label: Weapon
        name: weapon
        widget: string
        hint: The first glyph tile on the detail hero, e.g. GAUNTLET (SPIRIT FIST).
        i18n: true
      - label: Chi type
        name: chi
        widget: string
        hint: The second glyph tile, e.g. SPIRITUAL / ELECTRIC CHI.
        i18n: true
      - label: Introduction
        name: intro
        widget: text
        hint: Beside the portrait on the detail page, personality, fighting style, then age and spiritual bond. One paragraph each, a blank line between them.
        i18n: true
      - label: Lore
        name: lore
        widget: text
        hint: The backstory under the LORE heading. Plain text; leave a blank line between paragraphs.
        i18n: true
      - label: Core abilities
        name: abilities
        widget: list
        summary: '{{fields.name}}'
        i18n: true
        hint: Each ability has its own action shot, the picture on its tile. On the Igbo tab, an ability left without one uses the English ability's in the same position.
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Action shot, name: image, widget: image, required: false, hint: "The pose on this ability's tile. Leave it empty and the portrait stands in." }
          - { label: Description, name: text, widget: text }
      # A SELECT, NOT A BOOLEAN. As a boolean with `default: true` Decap never
      # wrote `false`: switched off and published, the file still said true
      # (kaira, 2026-09-24). A string it saves as chosen. Entries that still
      # carry the old `showAbilities` are read by lib/schemas/character.ts.
      - label: Core abilities section
        name: abilitiesSection
        widget: select
        options:
          - { label: Show, value: show }
          - { label: Hide, value: hide }
        default: show
        required: false
        hint: Hide takes the CORE ABILITIES section off this character's detail page. The abilities above are kept, so choosing Show again brings them back.
        i18n: duplicate
      - label: Forms
        name: variants
        widget: list
        required: false
        summary: '{{fields.name}}'
        hint: Only for a character with more than one form, like Nze Ugwuoke's staff and axe. Leave empty otherwise and the section does not appear.
        i18n: true
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Description, name: text, widget: text }
      # A list cannot be `duplicate` in Decap, so this one is per locale like the
      # abilities: fill it on the English tab, then "Fill in from another
      # locale" on the Igbo tab copies it across.
      - label: Gallery
        name: gallery
        widget: list
        hint: The renders in the detail page's gallery, in order. Same pictures on both tabs.
        i18n: true
        field: { label: Picture, name: src, widget: image }

  # ---------------------------------------------------------------------------
  # LEGAL. Terms & Conditions and Privacy Policy. src/lib/api/legal.ts reads
  # these at build (lib/schemas/legal.ts checks them).
  #
  # `create: false` and `delete: false`: there are exactly two legal pages and
  # each has a route, so the team rewrites them but cannot add a third or
  # delete one out from under /terms or /privacy. A section is one nav item and
  # one block of the document, add, remove or reorder them and the nav follows.
  # ---------------------------------------------------------------------------
  - name: legal
    label: Legal pages
    label_singular: Legal page
    description: Terms & Conditions and the Privacy Policy. Editing a section changes both the text and the nav beside it. Igbo tab as for News.
    folder: src/content/legal
    create: false
    delete: false
    i18n: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} (updated {{lastUpdated}})'
    sortable_fields: [order, title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: The heading on the band, e.g. TERMS & CONDITIONS.
        i18n: true
      - label: Last updated
        name: lastUpdated
        widget: string
        hint: The date alone, e.g. September 2026, "Last Updated:" is added for you.
        i18n: true
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: Only used to sort this list in the editor.
        i18n: duplicate
      - label: Sections
        name: sections
        widget: list
        summary: '{{fields.navLabel}}'
        hint: Each one is a block of the document and an item in the nav beside it, in this order.
        i18n: true
        fields:
          - label: Nav label
            name: navLabel
            widget: string
            hint: The short name in the nav, e.g. Account.
          - label: Heading
            name: heading
            widget: string
            hint: The heading above the text, e.g. YOUR ACCOUNT.
          - label: Text
            name: body
            widget: markdown
            hint: Paragraphs, bullet lists, links. Leave a blank line between paragraphs.

  # ---------------------------------------------------------------------------
  # TEAM, the people on the About page. Mirrors src/lib/team.ts plus the copy
  # under messages.about.team.members. Card framing stays in code, as above.
  # ---------------------------------------------------------------------------
  - name: team
    label: Team
    label_singular: Team member
    description: The people on the About page. Core team and Contributors, each its own tab (Partners are their own collection), in the order given here. Igbo tab as for News.
    folder: src/content/team
    create: true
    delete: true
    i18n: true
    extension: md
    format: frontmatter
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} ({{role}})'
    sortable_fields: [order, name]
    media_folder: /public/assets/about
    public_folder: /assets/about
    fields:
      - label: Name
        name: name
        widget: string
        hint: As it appears on the card, e.g. MICHAEL APELI.
        i18n: duplicate
      - label: Role
        name: role
        widget: string
        hint: e.g. Lead Technical Environment Artist.
        i18n: true
      - label: Group
        name: group
        widget: select
        options:
          - { label: Core team, value: core }
          - { label: Contributors, value: contributors }
        default: core
        hint: Which tab this person appears under on the About page.
        i18n: duplicate
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: Position within the tab. Lower comes first.
        i18n: duplicate
      - label: Show on the site
        name: visible
        widget: boolean
        default: true
        i18n: duplicate
      - label: Portrait
        name: image
        widget: image
        i18n: duplicate
      - label: Portrait description
        name: portraitAlt
        widget: string
        hint: e.g. Portrait of Michael Apeli.
        i18n: true

  # ---------------------------------------------------------------------------
  # PARTNERS, the logo row under the team on the About page. Its own collection
  # since 2026-09-28 (it was a tab of the team before); src/lib/api/partners.ts
  # reads these files at build (lib/schemas/partner.ts checks them). A logo is
  # the same in both locales, so nothing here is translated.
  # ---------------------------------------------------------------------------
  - name: partners
    label: Partners
    label_singular: Partner
    description: The partner logos on the About page, under the team, in the order given here. On the Igbo tab click "Fill in from another locale", then publish.
    folder: src/content/partners
    create: true
    delete: true
    i18n: true
    extension: md
    format: frontmatter
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    media_folder: /public/assets/partners
    public_folder: /assets/partners
    fields:
      - label: Name
        name: name
        widget: string
        hint: The partner's name, e.g. Solana Foundation. Read out to screen readers in place of the logo.
        i18n: duplicate
      - label: Logo
        name: logo
        widget: image
        hint: A transparent PNG or SVG, light on dark, with the name in it if the brand's logo has one. It is shown at a fixed height, so crop it tight.
        i18n: duplicate
      - label: Website
        name: url
        widget: string
        required: false
        hint: Optional, e.g. https://solana.org. The logo links there when set.
        i18n: duplicate
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: Position in the row. Lower comes first.
        i18n: duplicate
      - label: Show on the site
        name: visible
        widget: boolean
        default: true
        i18n: duplicate
  # ---------------------------------------------------------------------------
  # HALL OF ASCENSION, the season champions on the Competition page. Since
  # 2026-10-15; src/lib/api/hall.ts reads these files at build
  # (lib/schemas/hall.ts checks them). Only the tournament name is translated:
  # a handle, a season number and a portrait are the same in both locales.
  # ---------------------------------------------------------------------------
  - name: hall
    label: Hall of Ascension
    label_singular: Champion
    description: The season champions on the Competition page, one card each, in season order. A card switched off stays out of the hall; with none on, the section says Coming Soon. On the Igbo tab click "Fill in from another locale", then publish.
    folder: src/content/hall
    create: true
    delete: true
    i18n: true
    extension: md
    format: frontmatter
    identifier_field: handle
    slug: 'season-{{season}}-{{slug}}'
    summary: 'Season {{season}}: {{handle}}'
    sortable_fields: [season, handle]
    media_folder: /public/assets/hall
    public_folder: /assets/hall
    fields:
      - label: Champion's handle
        name: handle
        widget: string
        hint: The player's handle without the @, e.g. somamain. The card prints it in capitals.
        i18n: duplicate
      - label: Season
        name: season
        widget: number
        value_type: int
        min: 1
        default: 1
        hint: The season they won, e.g. 1. Cards are ordered by season.
        i18n: duplicate
      - label: Tournament
        name: tournament
        widget: string
        required: false
        hint: Optional. The tournament the season was named for, e.g. Wrath of Nze Ugwuoke. Shown after the season, "Season 1 – Wrath of Nze Ugwuoke".
        i18n: true
      - label: Portrait
        name: portrait
        widget: image
        hint: A character render on a transparent background, portrait-shaped (about 375 x 442). It fills the card's width from the top; the bottom is cropped.
        i18n: duplicate
      - label: Show on the site
        name: visible
        widget: boolean
        default: true
        i18n: duplicate
